  <!-- Gate guard: must run before rendering -->
  <script>
    (function() {
      try {
        var until  = Number(sessionStorage.getItem('hr.opsGatewayUnlockedUntil') || 0);
        var unlockedTarget = sessionStorage.getItem('hr.opsGatewayUnlockedTarget') || '';
        var token  = sessionStorage.getItem('hr.opsGatewayToken') || '';
        var tToken = sessionStorage.getItem('hr.opsGatewayToken.admin') || '';
        if (until > Date.now() && unlockedTarget === 'admin' && token && tToken && token === tToken) return;
        ['hr.opsGatewayUnlockedUntil','hr.opsGatewayUnlockedTarget','hr.opsGatewayToken'].forEach(function(k){sessionStorage.removeItem(k);});
        location.replace('../operations-gate/?target=admin&next=' + encodeURIComponent(location.pathname + location.search + location.hash));
      } catch(e) { location.replace('../operations-gate/?target=admin'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
