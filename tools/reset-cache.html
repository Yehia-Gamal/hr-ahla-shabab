<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسح كاش نظام الحضور</title>  <link rel="stylesheet" href="../shared/css/v105-ui-fixes.css?v=v39-consolidated-stable-110" />
  <link rel="stylesheet" href="../shared/css/v106-mobile-stability.css?v=v39-consolidated-stable-110" />
  <link rel="stylesheet" href="../shared/css/v107-final-ui-polish.css?v=v39-consolidated-stable-110" />
  <link rel="stylesheet" href="../shared/css/v108-final-bugfix.css?v=v108-final-bugfix" />
  <link rel="stylesheet" href="../shared/css/v109-final-system-fixes.css?v=v39-consolidated-stable-110" />
</head>
<body>
<main>
  <h1>مسح كاش نظام الحضور</h1>
  <p>استخدم هذه الصفحة إذا ظهرت رسالة أن Supabase غير مفعّل رغم ضبط الإعدادات.</p>
  <button id="clear" type="button">مسح الكاش وإعادة فتح النظام</button>
  <pre id="out"></pre>
</main>
<script>
  document.getElementById('clear').addEventListener('click', async () => {
    const out = document.getElementById('out');
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
        out.textContent += 'تم حذف Service Workers\n';
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
        out.textContent += 'تم حذف Caches\n';
      }
      localStorage.removeItem('hr.supabase.offlineQueue');
      localStorage.removeItem('hr.supabase.offlineQueue.safe');
      setTimeout(() => { location.href = '../index.html?v=fresh-' + Date.now(); }, 700);
    } catch (e) {
      out.textContent = e && e.message ? e.message : String(e);
    }
  });
</script>
  <script src="../shared/js/v105-ui-fixes.js?v=v39-consolidated-stable-110" defer></script>
  <script src="../shared/js/v106-mobile-stability.js?v=v39-consolidated-stable-110" defer></script>
  <script src="../shared/js/v107-final-ui-polish.js?v=v39-consolidated-stable-110" defer></script>
  <script src="../shared/js/v108-final-bugfix.js?v=v108-final-bugfix" defer></script>
  <script src="../shared/js/v109-final-system-fixes.js?v=v39-consolidated-stable-110" defer></script>
</body>
</html>
