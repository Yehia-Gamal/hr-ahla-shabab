<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh https://nominatim.openstreetmap.org https://api.github.com; frame-src https://www.openstreetmap.org https://maps.google.com;" />
  <meta name="theme-color" content="#050A1A" />
  <meta name="description" content="بوابة الدخول الذكية لنظام الحضور والإدارة لمجمع أحلى شباب" />
  <link rel="manifest" href="./shared/pwa/manifest-employee.json?v=v47-smart-entry-gateway" />
  <link rel="icon" href="./shared/images/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <title>بوابة الدخول الذكية - أحلى شباب</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020714;
      --panel: rgba(4, 16, 38, .9);
      --line: rgba(56, 199, 244, .5);
      --line-strong: rgba(124, 218, 255, .92);
      --text: #f8fbff;
      --muted: rgba(218, 232, 250, .84);
      --cyan: #22d3ee;
      --blue: #0b72ff;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: "Cairo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 8%, rgba(12, 92, 214, .34), transparent 34%),
        radial-gradient(circle at 50% 86%, rgba(34, 211, 238, .14), transparent 30%),
        #020714;
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .gateway {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .gateway-card {
      width: min(100%, 540px);
      aspect-ratio: 945 / 1680;
      min-height: min(100svh - 28px, 960px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(56, 199, 244, .28);
      border-radius: 30px;
      background: #020714 url("./shared/images/smart-gateway-hero.png") center top / cover no-repeat;
      box-shadow: 0 34px 110px rgba(0, 0, 0, .74), 0 0 80px rgba(14, 165, 233, .16);
    }

    .gateway-card::before {
      content: "";
      position: absolute;
      inset: 61% 0 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(2, 7, 20, .02), rgba(2, 7, 20, .78) 22%, #020714 100%),
        radial-gradient(circle at 50% 18%, rgba(34, 211, 238, .24), transparent 34%);
      pointer-events: none;
    }

    .portal-actions {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: clamp(58px, 7.5%, 78px);
      display: grid;
      gap: clamp(8px, 1.25vw, 12px);
      z-index: 1;
    }

    .portal-link {
      display: grid;
      grid-template-columns: clamp(42px, 10vw, 58px) minmax(0, 1fr) 24px;
      align-items: center;
      gap: 12px;
      direction: ltr;
      min-height: clamp(58px, 8.8vw, 82px);
      padding: clamp(8px, 1.5vw, 13px) clamp(12px, 2.2vw, 16px);
      border: 1px solid var(--line);
      border-radius: clamp(16px, 3.2vw, 22px);
      background: linear-gradient(135deg, rgba(6, 24, 57, .94), rgba(2, 11, 30, .9));
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 54px rgba(0, 0, 0, .36), 0 0 0 1px rgba(255, 255, 255, .04) inset;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .portal-link:hover,
    .portal-link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: linear-gradient(135deg, rgba(9, 42, 96, .96), rgba(2, 18, 48, .94));
      box-shadow: 0 22px 62px rgba(14, 165, 233, .26);
      outline: none;
    }

    .portal-link.primary {
      min-height: clamp(68px, 10vw, 94px);
      border-color: var(--line-strong);
      background: linear-gradient(180deg, rgba(41, 206, 255, .92), rgba(4, 62, 151, .96) 56%, rgba(4, 20, 54, .94));
      box-shadow: 0 18px 62px rgba(14, 165, 233, .42), 0 0 30px rgba(34, 211, 238, .2) inset;
    }

    .portal-icon {
      width: clamp(42px, 10vw, 58px);
      height: clamp(42px, 10vw, 58px);
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(124, 218, 255, .68);
      background: radial-gradient(circle, rgba(34, 211, 238, .28), rgba(11, 114, 255, .16));
      color: #c7f5ff;
      font-size: clamp(19px, 4.8vw, 28px);
      line-height: 1;
      box-shadow: 0 0 26px rgba(34, 211, 238, .24);
    }

    .portal-link strong,
    .portal-link span {
      display: block;
      min-width: 0;
    }

    .portal-link > span:nth-child(2) {
      direction: rtl;
    }

    .portal-link strong {
      color: var(--text);
      font-size: clamp(18px, 5.3vw, 30px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .portal-link:not(.primary) strong {
      font-size: clamp(16px, 4.3vw, 23px);
    }

    .portal-link span span {
      margin-top: 2px;
      color: var(--muted);
      font-size: clamp(10px, 2.8vw, 13px);
      font-weight: 800;
      line-height: 1.45;
    }

    .chevron {
      color: rgba(207, 237, 255, .9);
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1;
      transform: translateY(-1px);
    }

    .guest-link,
    .secure-note {
      position: absolute;
      z-index: 1;
      left: 7%;
      right: 7%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #bde8ff;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 900;
      text-align: center;
    }

    .guest-link {
      bottom: clamp(31px, 4.2%, 43px);
      color: rgba(220, 238, 255, .86);
    }

    .secure-note {
      bottom: clamp(10px, 1.6%, 18px);
    }

    @media (max-width: 460px) {
      .gateway {
        padding-inline: 0;
      }

      .gateway-card {
        width: 100%;
        min-height: 100svh;
        border-radius: 0;
        border-inline: 0;
      }

      .portal-actions {
        left: 6%;
        right: 6%;
        bottom: 70px;
      }

      .portal-link strong {
        font-size: clamp(18px, 6vw, 25px);
      }

      .portal-link:not(.primary) strong {
        font-size: clamp(16px, 5vw, 20px);
      }
    }

    @media (max-width: 350px) {
      .portal-link {
        grid-template-columns: 40px minmax(0, 1fr) 18px;
        gap: 8px;
      }

      .portal-icon {
        width: 40px;
        height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="gateway" aria-label="بوابة الدخول الذكية">
    <section class="gateway-card" aria-label="بوابة دخول مجمع أحلى شباب">
      <nav class="portal-actions" aria-label="روابط الدخول">
        <a class="portal-link primary" href="./employee/">
          <span class="portal-icon">●</span>
          <span><strong>دخول الموظفين</strong><span>الحضور والانصراف والطلبات</span></span>
          <span class="chevron">‹</span>
        </a>

        <a class="portal-link" href="./operations-gate/?target=admin&next=../admin/">
          <span class="portal-icon">⚙</span>
          <span><strong>دخول HR</strong><span>إدارة الموظفين والحضور والطلبات</span></span>
          <span class="chevron">‹</span>
        </a>

        <a class="portal-link" href="./operations-gate/?target=executive&next=../executive/">
          <span class="portal-icon">◎</span>
          <span><strong>دخول المدير التنفيذي</strong><span>رؤية شاملة وتقارير مباشرة</span></span>
          <span class="chevron">‹</span>
        </a>
      </nav>

      <a class="guest-link" href="./health.html">متابعة كزائر</a>
      <span class="secure-note">▣ بياناتك آمنة ومشفرة</span>
    </section>
  </main>
  <script src="./shared/js/register-sw.js?v=v47-smart-entry-gateway" defer></script>
</body>
</html>
