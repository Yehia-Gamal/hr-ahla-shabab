    <script>
      (function guardOperationsGate(){
        try {
          var unlockedUntil = Number(sessionStorage.getItem('hr.opsGatewayUnlockedUntil') || 0);
          var unlockedTarget = sessionStorage.getItem('hr.opsGatewayUnlockedTarget') || '';
          var token = sessionStorage.getItem('hr.opsGatewayToken') || '';
          var targetToken = sessionStorage.getItem('hr.opsGatewayToken.executive') || '';
          if (unlockedUntil > Date.now() && unlockedTarget === 'executive' && token && targetToken && token === targetToken) return;
          sessionStorage.removeItem('hr.opsGatewayUnlockedUntil');
          sessionStorage.removeItem('hr.opsGatewayUnlockedTarget');
          sessionStorage.removeItem('hr.opsGatewayToken');
          var next = location.pathname + location.search + location.hash;
          location.replace('../operations-gate/?target=executive&next=' + encodeURIComponent(next));
        } catch (error) {
          location.replace('../operations-gate/?target=executive');
        }
      })()
    </script>
