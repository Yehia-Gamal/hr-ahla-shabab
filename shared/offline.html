<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>غير متصل — أحلى شباب HR</title>
  <style>
    :root{--bg:#050A1A;--panel:#0B1628;--line:rgba(0,194,255,.20);--cyan:#00C2FF;--blue:#1A6EFF;--text:#E8F0FF;--muted:#7A94C1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;
      background:radial-gradient(circle at 30% 20%,rgba(26,110,255,.14),transparent 40%),var(--bg);
      color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;text-align:center;
      padding:clamp(16px,4vw,32px);line-height:1.75}
    .card{width:min(440px,100%);border:1px solid var(--line);border-radius:24px;
      background:linear-gradient(180deg,rgba(11,22,40,.96),rgba(7,16,30,.94));
      padding:clamp(24px,5vw,36px);box-shadow:0 0 0 1px rgba(0,194,255,.04),0 24px 70px rgba(0,0,0,.44);
      animation:card-in .4s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes card-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .icon{font-size:64px;margin-bottom:14px;animation:float 3s ease-in-out infinite;display:block}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    h1{font-size:clamp(22px,5vw,28px);margin:0 0 10px;font-weight:900;
      background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    p{color:var(--muted);line-height:1.8;margin:0 0 22px;font-size:15px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    button,a{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;
      font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s}
    .btn-primary{border:1px solid rgba(0,194,255,.5);background:linear-gradient(135deg,var(--cyan),var(--blue));
      color:#031022;box-shadow:0 6px 18px rgba(0,80,200,.28)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,80,200,.38)}
    .btn-ghost{border:1px solid var(--line);background:rgba(11,22,40,.88);color:var(--text)}
    .btn-ghost:hover{border-color:rgba(0,194,255,.4);transform:translateY(-1px)}
    .status-bar{margin-top:20px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--muted)}
    #online-status{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B6B;
      vertical-align:middle;margin-inline-end:6px;animation:blink 1.5s ease infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @media(max-width:400px){.btn-primary,.btn-ghost{width:100%}.actions{flex-direction:column}}
  </style>
  <link rel="stylesheet" href="css/v101-deep-quality.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v102-ui-overhaul.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v105-ui-fixes.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v106-mobile-stability.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v107-final-ui-polish.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v108-final-bugfix.css?v=v47-smart-entry-gateway" />
  <link rel="stylesheet" href="../shared/css/v109-final-system-fixes.css?v=v47-smart-entry-gateway" />
</head>
<body>
  <main class="card">
    <span class="icon">📡</span>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك بالإنترنت أو الشبكة وحاول مرة أخرى.<br>البيانات المحفوظة محلياً ستظهر بعد عودة الاتصال.</p>
    <div class="actions">
      <button class="btn-primary" type="button" data-retry-offline>🔄 إعادة المحاولة</button>
      <a class="btn-ghost" href="../employee/">الرئيسية</a>
    </div>
    <div class="status-bar">
      <span id="online-status"></span>
      <span id="status-text">لا يوجد اتصال</span>
    </div>
  </main>
  <script>
    const dot = document.getElementById('online-status');
    const txt = document.getElementById('status-text');
    function updateStatus() {
      if (navigator.onLine) {
        dot.style.background = '#00D68F';
        dot.style.animation = 'none';
        txt.textContent = 'عاد الاتصال — يمكنك إعادة المحاولة الآن';
      } else {
        dot.style.background = '#FF3B6B';
        dot.style.animation = 'blink 1.5s ease infinite';
        txt.textContent = 'لا يوجد اتصال';
      }
    }
    window.addEventListener('online',  updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
    // Auto reload when connection restored
    window.addEventListener('online', () => setTimeout(() => location.reload(), 1200));
  </script>
  <script src="js/v101-deep-quality.js?v=v47-smart-entry-gateway" defer></script>
  <script src="../shared/js/v102-enhancements.js?v=v47-smart-entry-gateway" defer></script>
<script>document.querySelector("[data-retry-offline]")?.addEventListener("click", () => location.reload());</script>
  <script src="../shared/js/v105-ui-fixes.js?v=v47-smart-entry-gateway" defer></script>
  <script src="../shared/js/v106-mobile-stability.js?v=v47-smart-entry-gateway" defer></script>
  <script src="../shared/js/v107-final-ui-polish.js?v=v47-smart-entry-gateway" defer></script>
  <script src="../shared/js/v108-final-bugfix.js?v=v47-smart-entry-gateway" defer></script>
  <script src="../shared/js/v109-final-system-fixes.js?v=v47-smart-entry-gateway" defer></script>
</body>
</html>
